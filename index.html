<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빌런 재판소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#5b3a24; --wood-dark:#3d2617; --wood-light:#8a5a3a;
    --paper:#fbf6ea; --paper-line:#e9dfc6;
    --ink:#2b2118; --muted:#7a6a58;
    --gold:#d9a441; --red:#c8402f; --blue:#3d6fb0; --green:#3f8a5a; --orange:#d9822b;
    --chip:#fff; --chip-on:#2b2118;
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:'Noto Sans KR',system-ui,sans-serif; color:var(--ink);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 2px, transparent 2px 120px),
      linear-gradient(180deg,#6b4429 0%, #4a2e1c 100%);
    min-height:100vh;
  }
  header{ text-align:center; padding:28px 16px 8px; color:#fff6e0; }
  header h1{ font-family:'Jua',sans-serif; font-size:clamp(34px,6vw,52px); margin:0; letter-spacing:2px;
    text-shadow:0 3px 0 var(--wood-dark), 0 6px 18px rgba(0,0,0,.35); }
  header h1 .scale{ display:inline-block; animation:sway 3s ease-in-out infinite; }
  header p{ margin:6px 0 0; opacity:.85; font-size:15px; }
  @keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

  .wrap{ max-width:1180px; margin:0 auto; padding:16px; display:grid; grid-template-columns:380px 1fr; gap:24px; align-items:start; }
  @media (max-width:900px){ .wrap{ grid-template-columns:1fr; } }

  /* ===== 판사석 ===== */
  .bench{ position:sticky; top:16px; }
  @media (max-width:900px){ .bench{ position:relative; top:0; } }
  .bench-card{
    background:linear-gradient(180deg,var(--wood-light),var(--wood));
    border:4px solid var(--wood-dark); border-radius:22px; padding:18px 16px 0; text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.15);
    overflow:hidden;
  }
  .bubble{
    position:relative; background:#fff; border-radius:16px; padding:12px 14px; font-size:15px; line-height:1.5;
    min-height:58px; display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,.15); margin-bottom:14px; font-family:'Jua',sans-serif; font-size:17px;
    transition:transform .2s;
  }
  .bubble::after{ content:''; position:absolute; bottom:-12px; left:50%; transform:translateX(-50%);
    border:12px solid transparent; border-top-color:#fff; border-bottom:0; }
  .bubble.pop{ animation:pop .35s ease; }
  @keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
  #hamster{ width:100%; max-width:300px; display:block; margin:0 auto; cursor:pointer; }
  #hamster .head-g{ transform-origin:100px 110px; transition:transform .4s; }
  #hamster.thinking .head-g{ animation:tilt 1.2s ease-in-out infinite; }
  #hamster.angry .head-g{ animation:shake .25s linear infinite; }
  @keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  #gavel{ transform-origin:160px 190px; transition:transform .15s; }
  #gavel.bang{ animation:bang .5s ease; }
  @keyframes bang{0%{transform:rotate(0)}40%{transform:rotate(-35deg)}70%{transform:rotate(12deg)}100%{transform:rotate(0)}}
  .desk{
    margin:0 -16px; background:linear-gradient(180deg,var(--wood-dark),#2a1910); color:var(--gold);
    padding:12px; font-family:'Gowun Batang',serif; font-weight:700; letter-spacing:3px; font-size:15px;
    border-top:3px solid #24150c;
  }
  .meter{ margin:14px 0 4px; text-align:left; color:#fff6e0; font-size:13px; }
  .meter-bar{ height:12px; background:rgba(0,0,0,.3); border-radius:99px; overflow:hidden; margin-top:6px; }
  .meter-fill{ height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--gold),var(--red)); transition:width .5s; border-radius:99px; }
  .meter-label{ display:flex; justify-content:space-between; }

  /* ===== 카드 공통 ===== */
  .card{
    background:var(--paper); border-radius:var(--radius); padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.3); position:relative;
  }
  .card h2{ font-family:'Jua',sans-serif; font-weight:400; margin:0 0 4px; font-size:26px; }
  .card .sub{ color:var(--muted); margin:0 0 18px; font-size:14px; }
  .field{ margin-bottom:22px; }
  .field > label, .field > .label{ display:block; font-weight:700; margin-bottom:8px; font-size:15px; }
  .field .hint{ font-weight:400; color:var(--muted); font-size:13px; margin-left:6px; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:2px solid var(--ink); background:var(--chip); color:var(--ink); border-radius:999px;
    padding:7px 14px; font:inherit; font-size:14px; cursor:pointer; transition:all .15s; user-select:none;
  }
  .chip:hover{ transform:translateY(-2px); box-shadow:0 3px 0 var(--ink); }
  .chip.on{ background:var(--chip-on); color:#fff; }
  input[type=text], textarea{
    width:100%; border:2px solid #d8ccb0; border-radius:12px; padding:12px 14px; font:inherit; font-size:15px;
    background:#fff; color:var(--ink); outline:none; transition:border-color .15s;
  }
  input[type=text]:focus, textarea:focus{ border-color:var(--wood-light); }
  textarea{ resize:vertical; line-height:1.6; }
  #story{ min-height:170px; }
  #selfFault{ min-height:70px; }
  .nick-custom{ margin-top:10px; }
  .counter{ text-align:right; font-size:12px; color:var(--muted); margin-top:4px; }
  .warn{
    display:none; margin-top:8px; background:#fff1e6; border:1.5px dashed var(--orange); border-radius:10px;
    padding:10px 12px; font-size:13.5px; line-height:1.5;
  }
  .warn.show{ display:block; }
  .warn button{ margin-left:6px; border:0; background:var(--orange); color:#fff; border-radius:8px; padding:4px 10px; cursor:pointer; font:inherit; font-size:13px; }
  .seg{ display:flex; border:2px solid var(--ink); border-radius:12px; overflow:hidden; }
  .seg button{ flex:1; border:0; background:#fff; padding:10px 4px; font:inherit; font-size:14px; cursor:pointer; border-right:2px solid var(--ink); }
  .seg button:last-child{ border-right:0; }
  .seg button.on{ background:var(--ink); color:#fff; }
  .range-row{ display:flex; align-items:center; gap:14px; }
  input[type=range]{ flex:1; accent-color:var(--red); height:28px; }
  .range-val{ min-width:120px; font-family:'Jua',sans-serif; font-size:18px; text-align:right; }
  .submit{
    width:100%; border:0; border-radius:14px; padding:16px; font-family:'Jua',sans-serif; font-size:22px;
    background:var(--red); color:#fff; cursor:pointer; box-shadow:0 5px 0 #8c2a1e; transition:transform .1s, box-shadow .1s;
  }
  .submit:hover{ filter:brightness(1.05); }
  .submit:active{ transform:translateY(4px); box-shadow:0 1px 0 #8c2a1e; }
  .submit:disabled{ background:#aaa; box-shadow:0 5px 0 #777; cursor:not-allowed; }
  .err{ color:var(--red); font-size:13.5px; margin-top:10px; min-height:18px; text-align:center; }

  /* ===== 심리 중 ===== */
  .deliberating{ display:none; text-align:center; padding:60px 20px; }
  .deliberating.show{ display:block; }
  .deliberating .big{ font-size:60px; animation:sway 1s ease-in-out infinite; display:inline-block; }
  .deliberating h3{ font-family:'Jua',sans-serif; font-weight:400; font-size:24px; margin:10px 0 6px; }
  .deliberating p{ color:var(--muted); margin:0; min-height:24px; }
  .dots::after{ content:''; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

  /* ===== 판결문 ===== */
  .verdict{ display:none; font-family:'Gowun Batang',serif;
    background: repeating-linear-gradient(180deg, transparent 0 31px, var(--paper-line) 31px 32px), var(--paper);
  }
  .verdict.show{ display:block; animation:fadeUp .5s ease; }
  @keyframes fadeUp{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
  .v-head{ text-align:center; border-bottom:3px double var(--ink); padding-bottom:14px; margin-bottom:18px; }
  .v-head .court{ letter-spacing:6px; font-size:14px; color:var(--muted); }
  .v-head h2{ font-family:'Gowun Batang',serif; font-weight:700; font-size:34px; letter-spacing:12px; margin:6px 0; }
  .v-meta{ display:flex; justify-content:center; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--muted); }
  .stamp-wrap{ text-align:center; margin:8px 0 22px; }
  .stamp{
    display:inline-block; font-family:'Jua',sans-serif; font-size:44px; padding:6px 26px; border:6px solid currentColor;
    border-radius:14px; transform:rotate(-8deg); letter-spacing:4px; opacity:0;
  }
  .stamp.go{ animation:stamp .55s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes stamp{0%{opacity:0; transform:rotate(-8deg) scale(2.6)}100%{opacity:.92; transform:rotate(-8deg) scale(1)}}
  .stamp-sub{ margin-top:10px; font-size:15px; color:var(--muted); }
  .sec{ margin-bottom:22px; }
  .sec h3{ font-size:19px; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .sec h3 .no{ display:inline-flex; width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--paper);
    align-items:center; justify-content:center; font-size:14px; font-family:'Noto Sans KR',sans-serif; }
  .sec p, .sec li{ line-height:1.85; font-size:16px; }
  .sec ul{ margin:0; padding-left:22px; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .two{ grid-template-columns:1fr; } }
  .box{ background:rgba(255,255,255,.7); border-radius:12px; padding:12px 14px; border-left:5px solid var(--ink); }
  .box.bad{ border-color:var(--red); }
  .box.sad{ border-color:var(--blue); }
  .box.self{ border-color:var(--orange); margin-top:14px; }
  .box h4{ margin:0 0 6px; font-size:15.5px; }
  .ratio{ margin-top:14px; }
  .ratio-bar{ display:flex; height:30px; border-radius:10px; overflow:hidden; font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:700; color:#fff; }
  .ratio-bar div{ display:flex; align-items:center; justify-content:center; white-space:nowrap; transition:width .8s; overflow:hidden; }
  .ratio-legend{ display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-top:4px; }
  .crimes{ display:flex; flex-wrap:wrap; gap:8px; }
  .crime{ background:var(--ink); color:var(--paper); padding:7px 14px; border-radius:8px; font-weight:700; font-size:15px; }
  .crime.light{ background:transparent; color:var(--ink); border:2px solid var(--ink); }
  .sentence{ background:#2b2118; color:#fff6e0; border-radius:14px; padding:16px 18px; }
  .sentence .main{ font-size:22px; font-weight:700; margin-bottom:8px; color:var(--gold); }
  .sentence li{ font-size:15.5px; }
  .comfort{
    display:flex; gap:14px; align-items:flex-start; background:#eaf2fb; border:2px solid #b9d0ec; border-radius:16px; padding:16px;
    font-family:'Noto Sans KR',sans-serif;
  }
  .comfort .emo{ font-size:42px; line-height:1; }
  .comfort h4{ margin:0 0 6px; font-family:'Jua',sans-serif; font-weight:400; font-size:19px; color:var(--blue); }
  .comfort p{ margin:0; line-height:1.7; font-size:15.5px; }
  .sign{ text-align:right; margin-top:24px; font-size:15px; }
  .sign b{ font-size:18px; }
  .seal{ display:inline-block; margin-left:8px; color:var(--red); border:2px solid var(--red); border-radius:50%; width:44px; height:44px;
    line-height:40px; text-align:center; font-weight:700; transform:rotate(-10deg); font-size:13px; vertical-align:middle; }
  .disclaimer{ text-align:center; font-size:12px; color:var(--muted); margin-top:18px; font-family:'Noto Sans KR',sans-serif; }
  .actions{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; font-family:'Noto Sans KR',sans-serif; }
  .actions button{ flex:1; min-width:150px; border:2px solid var(--ink); border-radius:12px; padding:12px; font:inherit; font-weight:700; cursor:pointer; background:#fff; }
  .actions button.primary{ background:var(--ink); color:#fff; }
  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(80px); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:99px; transition:transform .3s; z-index:10; font-size:14px; }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .hidden{ display:none !important; }
</style>
</head>
<body>

<header>
  <h1><span class="scale">⚖️</span> 빌런 재판소</h1>
  <p>억울한 사연, 햄스터 판사님이 공정(?)하게 심판해 드립니다</p>
</header>

<div class="wrap">
  <!-- ===== 판사석 ===== -->
  <aside class="bench">
    <div class="bench-card">
      <div class="bubble" id="bubble">어서 오세요. 무슨 일이 있었는지 들려주시겠어요?</div>
      <svg id="hamster" viewBox="0 0 200 215" aria-label="판사 햄스터">
        <!-- 몸통(법복) -->
        <path d="M40 215 Q42 150 100 145 Q158 150 160 215 Z" fill="#1e1a24"/>
        <path d="M88 148 L100 175 L112 148 Z" fill="#fff"/>
        <path d="M96 150 L100 160 L104 150 Z" fill="#c8402f"/>
        <!-- 앞발 -->
        <ellipse cx="72" cy="188" rx="12" ry="9" fill="#e9b07a"/>
        <!-- 의사봉 -->
        <g id="gavel">
          <rect x="140" y="160" width="6" height="42" rx="3" fill="#7a4a28" transform="rotate(35 143 181)"/>
          <rect x="138" y="145" width="34" height="16" rx="5" fill="#9b6236" transform="rotate(35 155 153)"/>
          <ellipse cx="146" cy="190" rx="12" ry="9" fill="#e9b07a"/>
        </g>
        <g class="head-g">
          <!-- 귀 -->
          <ellipse cx="52" cy="58" rx="18" ry="20" fill="#e9b07a"/>
          <ellipse cx="148" cy="58" rx="18" ry="20" fill="#e9b07a"/>
          <ellipse cx="52" cy="60" rx="10" ry="12" fill="#f4a6a6"/>
          <ellipse cx="148" cy="60" rx="10" ry="12" fill="#f4a6a6"/>
          <!-- 판사 가발 -->
          <g fill="#f5f2ea" stroke="#d9d2c0" stroke-width="1.5">
            <circle cx="42" cy="105" r="13"/><circle cx="40" cy="128" r="13"/><circle cx="44" cy="150" r="12"/>
            <circle cx="158" cy="105" r="13"/><circle cx="160" cy="128" r="13"/><circle cx="156" cy="150" r="12"/>
          </g>
          <!-- 얼굴 -->
          <ellipse cx="100" cy="102" rx="62" ry="56" fill="#e9b07a"/>
          <ellipse cx="100" cy="120" rx="44" ry="34" fill="#fbe9d3"/>
          <!-- 가발 윗부분 -->
          <g fill="#f5f2ea" stroke="#d9d2c0" stroke-width="1.5">
            <circle cx="62" cy="56" r="13"/><circle cx="82" cy="48" r="14"/><circle cx="100" cy="46" r="14"/>
            <circle cx="118" cy="48" r="14"/><circle cx="138" cy="56" r="13"/>
          </g>
          <!-- 볼 -->
          <ellipse id="cheekL" cx="66" cy="114" rx="11" ry="7" fill="#f4a6a6" opacity=".7"/>
          <ellipse id="cheekR" cx="134" cy="114" rx="11" ry="7" fill="#f4a6a6" opacity=".7"/>
          <!-- 코 -->
          <ellipse cx="100" cy="108" rx="5" ry="3.5" fill="#c46a5a"/>
          <!-- 표정 -->
          <g id="face"></g>
        </g>
        <g id="extras"></g>
      </svg>
      <div class="meter">
        <div class="meter-label"><span>🔥 판사님 분노 게이지</span><span id="meterTxt">0%</span></div>
        <div class="meter-bar"><div class="meter-fill" id="meterFill"></div></div>
      </div>
      <div class="desk">재판장 햄스터</div>
    </div>
  </aside>

  <!-- ===== 메인 ===== -->
  <main>
    <!-- 접수 폼 -->
    <section class="card" id="formCard">
      <h2>📝 사건 접수</h2>
      <p class="sub">상대방의 실명은 쓰지 말고 별명으로 불러 주세요. 모든 내용은 내 브라우저 안에서만 처리돼요.</p>

      <div class="field">
        <span class="label">피고의 별명 <span class="hint">실명 대신 사용할 호칭</span></span>
        <div class="chips" id="nickChips"></div>
        <input type="text" id="nickCustom" class="nick-custom" placeholder="직접 입력 (예: 탕비실 빌런)" maxlength="15">
      </div>

      <div class="field">
        <span class="label">사건 유형 <span class="hint">여러 개 선택 가능</span></span>
        <div class="chips" id="typeChips"></div>
      </div>

      <div class="field">
        <label for="story">무슨 일이 있었나요? <span class="hint">자유롭게, 자세할수록 정확한 판결</span></label>
        <textarea id="story" maxlength="2000" placeholder="예) 그 인간이 퇴근 10분 전에 자기 보고서를 저한테 넘기고 먼저 퇴근했어요. 이번이 벌써 세 번째예요. 다음 날 회의에서는 그 보고서를 자기가 다 한 것처럼 발표하더라고요..."></textarea>
        <div class="counter"><span id="storyCount">0</span> / 2000</div>
        <div class="warn" id="nameWarn"></div>
      </div>

      <div class="field">
        <span class="label">얼마나 자주 그랬나요?</span>
        <div class="seg" id="freqSeg">
          <button type="button" data-v="0">처음</button>
          <button type="button" data-v="1" class="on">가끔</button>
          <button type="button" data-v="2">자주</button>
          <button type="button" data-v="3">상습범</button>
        </div>
      </div>

      <div class="field">
        <label for="unfair">억울 지수</label>
        <div class="range-row">
          <input type="range" id="unfair" min="1" max="10" value="5">
          <div class="range-val" id="unfairVal"></div>
        </div>
      </div>

      <div class="field">
        <label for="selfFault">혹시 나도 잘못한 부분이 있다면? <span class="hint">선택 · 솔직할수록 공정한 판결</span></label>
        <textarea id="selfFault" maxlength="500" placeholder="예) 저도 참다가 결국 언성을 높였어요."></textarea>
      </div>

      <button class="submit" id="submitBtn">⚖️ 사건 접수하기</button>
      <div class="err" id="err"></div>
    </section>

    <!-- 심리 중 -->
    <section class="card deliberating" id="delib">
      <div class="big">🐹</div>
      <h3>재판부 심리 중<span class="dots"></span></h3>
      <p id="delibMsg"></p>
    </section>

    <!-- 판결문 -->
    <section class="card verdict" id="verdict"></section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   데이터
   ========================================================= */
const NICKS = ['그 인간', '빌런 A', '빌런 B', '그분', '저세상 빌런', '김부장(가명)'];

const TYPES = {
  dump: {
    label:'📦 업무 떠넘기기', name:'업무 떠넘기기', base:24,
    react:'일을 떠넘겼다고요? 해바라기씨가 목에 걸릴 뻔했어요.',
    crimes:['업무 무단 투척죄','책임 증발 및 잠적죄','퇴근 직전 폭탄 투하죄','"이것 좀 해줄래?" 남용죄'],
    wrongs:['자기 몫의 업무를 정당한 사유 없이 원고에게 전가함','업무 분배의 공정성을 훼손하고 책임을 회피함'],
    grievances:['내 일도 아닌데 시간과 스트레스는 고스란히 원고의 몫이 됨','거절하기 어려운 분위기 속에서 일을 떠안을 수밖에 없었음'],

const ham = document.getElementById('hamster');
let currentFace = '';
function setFace(name){
  if(currentFace === name) return;
  currentFace = name;
  const f = FACES[name];
  document.getElementById('face').innerHTML = f.face;
  document.getElementById('extras').innerHTML = f.extras;
  ['cheekL','cheekR'].forEach(id=>{
    const c = document.getElementById(id);
    c.setAttribute('opacity', f.cheek);
    c.setAttribute('fill', f.cheekColor || '#f4a6a6');
    c.setAttribute('rx', f.cheek >= 1 ? 13 : 11);
  });
  ham.classList.remove('thinking','angry');
  if(name === 'thinking') ham.classList.add('thinking');
  if(name === 'angry') ham.classList.add('angry');
}
function say(text){
  const b = document.getElementById('bubble');
  b.textContent = text;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
}
function setMeter(v){

function hasBatchim(word){
  const w = String(word).replace(/\(가명\)$/,'').replace(/[\s\)\]\}'"]+$/,'').trim();
  const c = w.slice(-1);
  if(!c) return false;
  const code = c.charCodeAt(0);
  if(code >= 0xAC00 && code <= 0xD7A3) return (code - 0xAC00) % 28 !== 0;
  if(/[0-9]/.test(c)) return '0136780'.includes(c);
  if(/[a-z]/i.test(c)) return /[lmnr]/i.test(c);
  return false;
}
const J = (w, a, b) => w + (hasBatchim(w) ? a : b);   // J('빌런 A','이','가')

const ROLE_WORDS = /^(우리|그|저|이|옆|윗|아랫|전|새|신입|팀|부|과|차|대|사|주|실|이사|선배|후배|동기|사장|교수|대리|과장|부장|차장|팀장|사원|주임|실장|책임|선임|수석|본부장|센터장|그분|그인간|빌런)/;
const NAME_RE = /([가-힣]{3})\s?(씨|님|과장|대리|부장|차장|팀장|사원|주임|선배|실장|이사|책임|선임|수석|교수)/g;
let foundNames = [];
function checkNames(){
  const text = $('story').value;
  const set = new Set();
  let m; NAME_RE.lastIndex = 0;
  while((m = NAME_RE.exec(text))){
    const name = m[1];
    if(ROLE_WORDS.test(name)) continue;
    if(/(님|씨|장|리|원|임|배|사)$/.test(name)) continue;
    set.add(name);
  }
  foundNames = [...set];
  const w = $('nameWarn');
  if(foundNames.length){
    w.innerHTML = `🙈 실명으로 보이는 단어가 있어요: <b>${foundNames.map(esc).join(', ')}</b><br>상대방 보호를 위해 별명으로 바꿔 주세요.<button type="button" id="replaceBtn">'${esc(state.nick)}'(으)로 바꾸기</button>`;

      checkNames();
      say('실명은 가렸어요. 재판소는 익명을 보장합니다! 🤫');
    };

}

/* =========================================================
   분석 엔진
   ========================================================= */
function analyze(){
  const story = $('story').value.trim();
  const self = $('selfFault').value.trim();
  const unfair = +$('unfair').value;
  const types = [...state.types];
  if(!types.length) types.push('etc');

  // 피고 점수
  const bases = types.map(k=>TYPES[k].base).sort((a,b)=>b-a);
  let v = bases[0] + (bases.length-1)*6;
  const hits = AGGRAVATORS.filter(a=>a.re.test(story));
  hits.forEach(h=> v += h.w);
  v += FREQ[state.freq].w;
  v += Math.min(story.length/40, 10);
  v += (unfair-5) * 2;
  const mitigated = MITIGATORS.test(story);
  if(mitigated) v -= 12;
  v = Math.max(5, Math.min(100, Math.round(v)));

  // 원고 점수
  let s = 0;
  const selfHits = SELF_FAULTS.filter(f=>f.re.test(story) || f.re.test(self));
  selfHits.forEach(f=> s += f.w);
  if(self.length) s += 10 + Math.min(self.length/15, 12);
  s = Math.min(100, Math.round(s));

  // 판결
  let kind;
  if(v < 38 && s < 20)           kind = 'innocent';
  else if(s >= 22 && s >= v*0.45) kind = 'mutual';
  else if(v >= 78)                kind = 'heavy';
  else                            kind = 'guilty';

  return { story, self, unfair, types, v, s, hits, selfHits, mitigated, kind };
}

function livePreview(keepBubble){
  const story = $('story').value.trim();
  if(!story && !state.types.size){ setFace('neutral'); setMeter(0); return; }
  const r = analyze();
  setMeter(r.kind==='innocent' ? r.v*0.6 : r.v);
  let face, line;
  if(r.v >= 70){ face='angry'; line='으으... 듣기만 해도 괘씸하군요! 😠'; }
  else if(r.v >= 45){ face='stern'; line='흠... 이건 그냥 넘어갈 일이 아닌 것 같네요.'; }
  else if(story.length > 10){ face='curious'; line='오호, 그래서요? 계속 말씀해 주세요.'; }
  else { face='neutral'; line='천천히 써 주세요. 저 해바라기씨 먹으면서 기다릴게요.'; }
  if(r.s >= 20 && r.v < 70){ face='confused'; line='음? 원고 측 사정도 좀 있는 것 같은데요...'; }
  setFace(face);
  if(!keepBubble) say(line);
}

function buildLists(r){
  const wrongs = [], griefs = [];
  r.types.forEach(k=>{ wrongs.push(TYPES[k].wrongs[0]); griefs.push(TYPES[k].grievances[0]); });
  r.hits.forEach(h=>{ if(h.wrong) wrongs.push(h.wrong); if(h.grief) griefs.push(h.grief); });
  if(r.types.length === 1){ const t = TYPES[r.types[0]]; wrongs.push(t.wrongs[1]); griefs.push(t.grievances[1]); }
  if(state.freq >= 2) wrongs.push('같은 잘못을 고치지 않고 되풀이함');
  if(r.unfair >= 8) griefs.push('혼자 꾹꾹 참아 온 감정이 한계에 이를 만큼 쌓임');
  const uniq = a => [...new Set(a)];
  return { wrongs: uniq(wrongs).slice(0,5), griefs: uniq(griefs).slice(0,5) };
}

function buildSelfList(r){
  const list = r.selfHits.map(f=>f.tag);
  if(r.self) list.unshift(`원고 스스로 "${r.self.length>60 ? r.self.slice(0,58)+'…' : r.self}"라고 진술함`);
  return [...new Set(list)];
}

function buildCrimes(r){
  const mods = r.hits.filter(h=>h.mod).map(h=>h.mod);
  const crimes = r.types.map((k,i)=>{
    let c = pick(TYPES[k].crimes);
    const m = mods[i];
    if(m && r.kind !== 'innocent') c = `${m} ${c}`;
    return c;
  });
  if(r.kind === 'heavy') crimes.push('특수 괘씸죄');
  if(state.freq === 3 && r.kind !== 'innocent' && !crimes.some(c=>c.startsWith('상습'))) crimes.push('상습 민폐 가중죄');
  const selfCrimes = r.kind === 'mutual'
    ? [...new Set(r.selfHits.filter(f=>f.crime).map(f=>f.crime))].concat(r.selfHits.some(f=>f.crime) ? [] : ['쌍방 감정 소모죄'])
    : [];
  return { crimes:[...new Set(crimes)], selfCrimes };
}

          <h4>🙅 피고 '${esc(nick)}'의 잘못</h4>
          ${r.kind==='innocent'
            ? `<ul><li>고의성을 입증할 정황이 부족함</li>${lists.wrongs.slice(0,1).map(w=>`<li>다만 "${esc(w)}" 부분은 주의가 필요함</li>`).join('')}</ul>`
            : `<ul>${lists.wrongs.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`}
        </div>
        <div class="box sad">
          <h4>😢 원고의 억울한 부분</h4>
          <ul>${lists.griefs.map(g=>`<li>${esc(g)}</li>`).join('')}</ul>
        </div>
      </div>
      ${selfList.length ? `
      <div class="box self">
        <h4>🤔 원고 측 사정 ${r.kind==='mutual' ? '(과실 인정)' : '(참고)'}</h4>
        <ul>${selfList.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      </div>` : ''}
      ${r.kind==='mutual' ? `
      <div class="ratio">
        <div class="ratio-bar">
          <div style="width:${pv}%;background:var(--red)">피고 ${pv}%</div>
          <div style="width:${100-pv}%;background:var(--orange)">원고 ${100-pv}%</div>
        </div>
        <div class="ratio-legend"><span>피고 '${esc(nick)}'</span><span>원고(나)</span></div>
      </div>` : ''}
      <p style="margin-top:12px">⚖️ ${esc(reason)}</p>
    </div>

    <div class="sec">
      <h3><span class="no">3</span>죄목</h3>
      ${r.kind==='innocent'
        ? `<div class="crimes"><span class="crime light">혐의 없음</span><span class="crime light">단, '눈치 부족' 경고 1회</span></div>`
        : `<div class="crimes">${crimes.map(c=>`<span class="crime">${esc(c)}</span>`).join('')}</div>
           ${selfCrimes.length ? `<p style="margin:10px 0 0;font-size:14.5px">원고 측: ${selfCrimes.map(c=>`<span class="crime light" style="font-size:13.5px;padding:4px 10px">${esc(c)} (경미)</span>`).join(' ')}</p>` : ''}`}
    </div>

    <div class="sec">
      <h3><span class="no">4</span>주문 (형량)</h3>
      <div class="sentence">
        <div class="main">${esc(sentence.main)}</div>
        <ul>${sentence.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
      </div>
    </div>

    ${showComfort ? `
    <div class="sec">
      <h3><span class="no">5</span>재판장의 위로</h3>
      <div class="comfort">
        <div class="emo">${comfort.emo}</div>
        <div><h4>${esc(comfort.title)}</h4><p>${esc(comfort.text)}</p></div>
      </div>
    </div>` : ''}

    <div class="sign">${today()}<br>재판장 판사 <b>햄 스 터</b><span class="seal">햄스터<br></span></div>
    <div class="disclaimer">※ 본 판결은 법적 효력이 전혀 없으며, 해바라기씨를 좋아하는 햄스터의 지극히 주관적인 의견입니다.</div>

    <div class="actions">
      <button id="copyBtn">📋 판결문 복사</button>
      <button id="editBtn">✏️ 사연 수정해서 재심</button>
      <button id="newBtn" class="primary">🆕 새 사건 접수</button>
    </div>
  `;
  const el = $('verdict');
  el.innerHTML = html;

  // 복사용 텍스트
  const plain = [
    `[빌런 재판소 판결문] 사건번호 ${no}`,
    `판결: ${info.stamp.replace(/\s/g,'')} (${info.sub})`,
    ``,
    `■ 피고: ${nick}`,
    `■ 사건 유형: ${r.types.map(k=>TYPES[k].name).join(', ')}`,
    `■ 죄목: ${r.kind==='innocent' ? '혐의 없음' : crimes.join(', ')}`,
    `■ 형량: ${sentence.main}`,
    ...sentence.items.map(i=>`  - ${i}`),
    showComfort ? `\n■ 재판장의 위로: ${comfort.text}` : '',
    `\n※ 본 판결은 법적 효력이 없습니다. — 재판장 햄스터`
  ].join('\n');

  $('copyBtn').onclick = ()=> copyText(plain);
  $('editBtn').onclick = ()=> { showForm(); say('사연을 고쳐서 다시 접수해 주세요. 재심 받아드립니다!'); };
  $('newBtn').onclick = ()=> { resetForm(); showForm(); };

  // 연출
  setTimeout(()=>{
    $('stamp').classList.add('go');
    bangGavel();
    setFace(info.face);
    say(info.bubble);
    setMeter(r.kind==='innocent' ? 10 : r.kind==='mutual' ? r.v*0.7 : r.v);
  }, 250);

  if(showComfort && r.unfair >= 8){
    setTimeout(()=>{ setFace('sad'); say('그런데... 사연 읽다가 저도 눈물이 났어요. 정말 고생 많으셨어요 🥲'); }, 4200);
  }
}

  '증거 자료를 볼주머니에 넣는 중',
  '해바라기씨 까면서 고민하는 중',

    $('story').focus();
    return;
  }
  if(foundNames.length){

    say('잠깐! 실명은 가려 주셔야 해요. 🙈');

function showForm(){
  $('verdict').classList.remove('show');
  $('formCard').classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}
function resetForm(){
  $('story').value=''; $('selfFault').value=''; $('storyCount').textContent='0';
  $('nickCustom').value=''; state.nick = NICKS[0];
  nickWrap.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on', i===0));
  state.types.clear(); typeWrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  state.freq = 1; $('freqSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v==='1'));
  $('unfair').value = 5; updUnfair();
  checkNames(); setMeter(0); setFace('neutral');
  say('새 사건을 접수합니다. 무슨 일이 있었나요?');
}

function copyText(t){
  const done = ()=> toast('판결문이 복사되었어요! 📋');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('복사에 실패했어요 😢'); }
  ta.remove();
}
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}
